name: "Headhunter"
description: "Run Headhunter as an automated collaborator/reviewer on GitHub issues and pull requests."
author: "xnet-admin-1"
branding:
  icon: "crosshair"
  color: "red"

inputs:
  model:
    description: "Provider/model Headhunter should use (e.g. anthropic/claude-sonnet-4-5-20250929). Defaults to Headhunter's built-in default."
    required: false
    default: ""
  version:
    description: "Headhunter version to install (e.g. v0.77.0). Defaults to the latest release."
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - name: Install Headhunter
      shell: bash
      env:
        HEADHUNTER_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        VERSION="${HEADHUNTER_VERSION:-latest}"
        if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ]; then
          VERSION="$(curl -fsSL https://api.github.com/repos/xnet-admin-1/Headhunter/releases/latest \
            | grep -o '"tag_name": *"[^"]*"' | head -1 | cut -d'"' -f4)"
        fi
        if [ -z "$VERSION" ]; then
          echo "::error::could not determine Headhunter version to install" >&2
          exit 1
        fi
        VER="${VERSION#v}"

        case "$(uname -s)" in
          Linux)  OS=linux ;;
          Darwin) OS=darwin ;;
          *) echo "::error::unsupported OS $(uname -s)" >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64)  ARCH=amd64 ;;
          aarch64|arm64) ARCH=arm64 ;;
          *) echo "::error::unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac

        URL="https://github.com/xnet-admin-1/Headhunter/releases/download/${VERSION}/headhunter_${VER}_${OS}_${ARCH}.tar.gz"
        echo "Installing Headhunter ${VERSION} from ${URL}"

        TMP="$(mktemp -d)"
        curl -fsSL "$URL" | tar -xz -C "$TMP"
        mkdir -p "$HOME/.headhunter/bin"
        mv "$TMP/headhunter" "$HOME/.headhunter/bin/headhunter"
        chmod +x "$HOME/.headhunter/bin/headhunter"
        echo "$HOME/.headhunter/bin" >> "$GITHUB_PATH"
        rm -rf "$TMP"

    - name: Verify Headhunter
      shell: bash
      run: headhunter --version

    - name: Run Headhunter
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        ARGS=()
        if [ -n "${MODEL:-}" ]; then
          ARGS+=(--model "$MODEL")
        fi
        headhunter github run ${ARGS[@]+"${ARGS[@]}"}
